<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아메리카, 문화가 만나는 자리</title>
<meta name="description" content="중학교 사회(지리) [9사(지리)05-02] 아메리카의 인구 특징과 문화 혼종성 — 모둠 대항 지도 찍기 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 지도책(아틀라스) 느낌: 종이색 배경, 남색 글씨, 테라코타 강조색, 얇은 선과 부드러운 그림자 */
:root {
  color-scheme: light;
  --bg: #F4F1EA; --paper: #FBF9F4; --card: #FFFFFF; --soft: #F3EFE6; --line: #E2DCCF; --line-d: #CFC6B4;
  --ink: #172A3A; --muted: #5C6977; --navy: #172A3A; --navy-2: #21405A;
  --accent: #D9572B; --accent-d: #B9451C; --accent-soft: #FBE7DE;
  --gold: #E3A73A; --gold-soft: #FBF1DC; --teal: #2A8C82;
  --sea: #BCD8E4; --land-am: #F3E8CB; --land: #E6E1D6; --land-line: #A8996F;
  --ok: #1E7F5C; --ok-soft: #E1F2EA; --bad: #C2402C; --bad-soft: #FBE5E0;
  --shadow: 0 1px 2px rgb(23 42 58 / .06), 0 6px 20px rgb(23 42 58 / .07);
  --f-game: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; letter-spacing: -0.01em; word-break: keep-all; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { font-family: var(--f-game); font-weight: 800; margin: 0; line-height: 1.25; letter-spacing: -0.03em; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 상단 바 */
.top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--f-game); font-weight: 800; font-size: 19px; letter-spacing: -0.03em; cursor: pointer; background: none; border: 0; color: #fff; padding: 0; }
.brand span, .brand small { color: var(--gold); font-weight: 600; font-size: 12px; letter-spacing: .14em; }
.top-info { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hud { display: inline-flex; align-items: center; gap: 6px; background: rgb(255 255 255 / .08); border-radius: 8px; padding: 4px 10px; font-size: 14px; font-weight: 600; color: rgb(255 255 255 / .8); }
.hud b { color: #fff; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud svg { width: 15px; height: 15px; }
main { max-width: 1240px; margin: 0 auto; padding: 22px 16px 60px; }

/* 공통 */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: clamp(18px, 3vw, 30px); display: grid; gap: 16px; }
.card h2 { font-size: clamp(24px, 3vw, 30px); }
.kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.lead { color: var(--muted); max-width: 66ch; }
.hint { font-size: 14px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-game); font-weight: 700; font-size: 16px; background: var(--navy); color: #fff; border: 1px solid var(--navy); border-radius: 10px; padding: 10px 20px; cursor: pointer; text-decoration: none; transition: background .15s, transform .1s; }
.btn:hover { background: var(--navy-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.ghost { background: #fff; color: var(--ink); border-color: var(--line-d); }
.btn.ghost:hover { background: var(--soft); }
.btn.gold, .btn.big { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.gold:hover, .btn.big:hover { background: var(--accent-d); }
.btn.mint { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.big { font-size: 18px; padding: 14px 24px; width: 100%; border-radius: 12px; }
.btn.small { font-size: 14px; padding: 6px 12px; border-radius: 8px; }
.btn:disabled { background: #E7E3DA; color: #9A9789; border-color: #E7E3DA; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
input[type="text"], textarea, select { font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid var(--line-d); border-radius: 10px; padding: 10px 12px; width: 100%; }
input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgb(23 42 58 / .12); }
textarea { min-height: 80px; resize: vertical; line-height: 1.55; }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; min-height: 110px; }
label.f { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
label.f span.sub { font-weight: 400; color: var(--muted); font-size: 13.5px; }
.notice { background: var(--gold-soft); border: 1px solid #EBD5A6; border-radius: 12px; padding: 12px 16px; font-weight: 500; }
.toast { font-size: 15px; color: var(--ok); font-weight: 700; }
.err { font-size: 15px; color: var(--bad); font-weight: 700; }
.codebox { display: grid; gap: 8px; }
details > summary { cursor: pointer; }

/* 첫 화면 */
.title-screen { position: relative; overflow: hidden; border-radius: 20px; padding: clamp(24px, 5vw, 56px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 240px); gap: clamp(16px, 4vw, 48px); align-items: center; color: #fff;
  background-color: var(--navy);
  background-image: linear-gradient(rgb(255 255 255 / .05) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .05) 1px, transparent 1px), radial-gradient(120% 90% at 100% 100%, #2D5872 0%, transparent 60%);
  background-size: 48px 48px, 48px 48px, auto; }
.title-screen .hero-art { order: 2; }
@media (max-width: 640px) { .title-screen { grid-template-columns: 1fr; } .title-screen .hero-art { order: 0; max-width: 150px; } }
.hero-art { width: 100%; max-width: 240px; height: auto; justify-self: center; }
@media (prefers-reduced-motion: no-preference) { .hero-art .pin { animation: bob 2.6s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(-6px); } } }
.title-text { display: grid; gap: 16px; }
.badge { justify-self: start; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--gold); border: 1px solid rgb(227 167 58 / .5); padding: 4px 12px; border-radius: 999px; }
.title-text h1 { font-size: clamp(38px, 6.4vw, 66px); font-weight: 900; letter-spacing: -0.045em; line-height: 1.08; color: #fff; }
.title-text h1 em { font-style: normal; color: var(--gold); }
.title-text p { font-size: 17px; color: rgb(255 255 255 / .78); max-width: 46ch; }
.how3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .how3 { grid-template-columns: 1fr; } }
.how { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: start; }
.how .hn { grid-row: 1 / 3; font-size: 26px; font-weight: 900; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.how .hn::before { content: "0"; }
.how b { font-weight: 800; font-size: 17px; }
.how span:last-child { font-size: 14px; color: var(--muted); }
.modes { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .modes { grid-template-columns: 1fr; } }
.mode { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 20px 22px; cursor: pointer; display: grid; gap: 4px; color: var(--ink); transition: transform .15s, box-shadow .15s; }
.mode:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgb(23 42 58 / .06), 0 12px 28px rgb(23 42 58 / .1); }
.mode b { font-weight: 800; font-size: 21px; letter-spacing: -0.03em; }
.mode span { font-size: 14px; color: var(--muted); }
.mode.play { background: var(--accent); border-color: var(--accent); color: #fff; }
.mode.play b { font-size: 28px; }
.mode.play b::after { content: " →"; }
.mode.play span { color: rgb(255 255 255 / .85); }

/* 게임 방법 */
.rules { max-width: 860px; margin: 0 auto; gap: 18px; }
.rule-count { font-size: 14px; font-weight: 800; color: var(--teal); background: #E3F1EF; padding: 4px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.rule-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rule-steps li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); transition: opacity .2s, border-color .2s, background .2s; }
.rule-steps li.now { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rule-steps li.later { opacity: .4; }
.rule-steps li.later p { display: none; }
.rule-steps li.done { background: #F2F8F6; border-color: #CFE5E0; }
.rule-steps li.done .hn { color: var(--teal); }
.rule-steps .hn { font-size: 26px; font-weight: 900; color: var(--accent); line-height: 1.15; font-variant-numeric: tabular-nums; align-self: start; }
.rule-steps .hn::before { content: "0"; }
.rule-steps b { font-size: 17.5px; font-weight: 800; }
.rule-steps p { color: #34465A; font-size: 15.5px; margin-top: 2px; }
.rule-steps li.ex p > span { display: block; margin-top: 8px; }
.rule-steps p b { font-size: inherit; font-weight: 800; color: var(--ink); }
.rule-steps li.ex p > span.ex-ans { display: flex; }
.rule-steps em { font-style: normal; font-weight: 700; color: var(--accent-d); white-space: nowrap; }
.okbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line-d); background: #fff; color: var(--muted); border-radius: 999px; padding: 7px 14px 7px 10px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.okbtn svg { width: 18px; height: 18px; border-radius: 50%; padding: 2px; background: var(--soft); color: #B9B2A2; }
li.now .okbtn { border-color: var(--accent); color: var(--accent-d); }
li.now .okbtn:hover { background: var(--accent-soft); }
li.done .okbtn { border-color: var(--teal); background: var(--teal); color: #fff; cursor: default; }
li.done .okbtn svg { background: rgb(255 255 255 / .25); color: #fff; }
li.later .okbtn { cursor: not-allowed; }
@media (max-width: 600px) { .rule-steps li { grid-template-columns: auto minmax(0, 1fr); } .okbtn { grid-column: 2; justify-self: start; } }
.ex-clue { font-size: 16px; line-height: 1.7; color: var(--ink); background: var(--gold-soft); border-left: 3px solid var(--gold); border-radius: 4px 10px 10px 4px; padding: 10px 14px; }
.ex-clue mark { background: none; font-weight: 800; box-shadow: inset 0 -0.45em 0 rgb(227 167 58 / .35); color: inherit; }
.ex-ans { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ex-ans > span:first-child { font-size: 13px; font-weight: 800; color: var(--muted); margin-right: 4px; }
.ex-ans .rchip { background: var(--c); border-color: var(--c); color: #fff; cursor: default; }
.ex-ans .rchip i { background: #fff; }
.ex-notes { font-size: 14.5px; color: #34465A; }

/* 진행판 */
.board-wrap { background: var(--navy); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.board-wrap svg { display: block; width: 100%; height: auto; }
.node { cursor: default; }
.node.current { cursor: pointer; }
.node.current:focus-visible { outline: none; }
.node.current:focus-visible .face { stroke: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .node.current .pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }
  .node.just .face { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { transform: scale(.6); } to { transform: none; } }
}
.stage-foot { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.stage-foot .btn { min-width: 240px; width: auto; }

/* 게임 화면 */
.game { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .game { grid-template-columns: 1fr; } }
.mapbox { position: relative; background: var(--sea); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.mapbox svg { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; user-select: none; }
.mapbox .country { fill: var(--land); stroke: #C7BFAE; stroke-width: .5; vector-effect: non-scaling-stroke; }
.mapbox .country.am { fill: var(--land-am); stroke: var(--land-line); stroke-width: .8; }
.mapbox .city circle.hit { fill: transparent; stroke: none; }
.mapbox .city circle.dot { fill: #fff; stroke: var(--ink); stroke-opacity: .65; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.mapbox .city text { display: none; font-family: var(--f-body); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3.5px; vector-effect: non-scaling-stroke; pointer-events: none; }
.mapbox.named .city text { display: block; }
.mapbox .area { fill: var(--gold); fill-opacity: .16; stroke: #B07B17; stroke-width: 2; stroke-dasharray: 8 6; vector-effect: non-scaling-stroke; pointer-events: none; }
.mapbox .clabels text { font-family: var(--f-body); font-weight: 700; fill: #6E6248; fill-opacity: .85; letter-spacing: .02em; pointer-events: none; paint-order: stroke; stroke: rgb(255 255 255 / .55); stroke-width: 2.5px; vector-effect: non-scaling-stroke; }
.mapbox .clabels text.small { display: none; }
.mapbox.named .clabels text.small { display: block; }
.mapbox .graticule { fill: none; stroke: #fff; stroke-opacity: .45; stroke-width: .5; vector-effect: non-scaling-stroke; }
.map-tools { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; }
.map-tools button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line-d); background: #fff; color: var(--ink); font-size: 20px; font-weight: 600; cursor: pointer; line-height: 1; box-shadow: 0 1px 3px rgb(23 42 58 / .12); }
.map-tools button:hover { background: var(--soft); }
.map-msg { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgb(23 42 58 / .88); color: #fff; border-radius: 999px; padding: 6px 16px; font-size: 14.5px; font-weight: 600; pointer-events: none; white-space: nowrap; }
.map-fail { padding: 40px 20px; text-align: center; color: var(--ink); background: #fff; }
.tip { position: absolute; pointer-events: none; background: var(--navy); color: #fff; font-size: 13.5px; padding: 5px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); z-index: 3; }
.ctip { position: absolute; z-index: 4; width: 270px; max-width: calc(100% - 16px); background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgb(23 42 58 / .18); padding: 12px 14px; font-size: 13.5px; line-height: 1.55; pointer-events: none; display: grid; gap: 4px; }
.ctip .ct-img { margin: -12px -14px 6px; border-radius: 11px 11px 0 0; overflow: hidden; background: var(--soft); }
.ctip .ct-img img { display: block; width: 100%; height: 140px; object-fit: cover; opacity: 0; transition: opacity .25s; }
.ctip .ct-img.on img { opacity: 1; }
.ctip .ct-img figcaption { font-size: 11px; color: var(--muted); padding: 4px 10px; }
.ctip > b { font-size: 16px; font-weight: 800; }
.ctip .ct-c { font-size: 12.5px; font-weight: 700; color: var(--accent); margin-top: -4px; }
.ctip .ct-r { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.ctip .ct-n { margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.ctip .ct-n b { color: var(--ink); margin-right: 4px; }
.mapbox .city { cursor: pointer; }
.layers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.layers .lab { font-size: 14px; font-weight: 800; margin-right: 4px; }
.lchip { border: 1px solid var(--line-d); background: #fff; color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.lchip:hover { border-color: var(--c, var(--ink)); }
.lchip[aria-pressed="true"] { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: #fff; }

.panel { display: grid; gap: 12px; align-content: start; min-width: 0; }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stage-no { font-size: 12.5px; font-weight: 700; letter-spacing: .12em; color: var(--muted); margin-left: auto; }
.cat { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 6px; background: var(--soft); color: var(--ink); }
.boss-tag { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-d); }
.qclue { font-size: 17.5px; line-height: 1.75; font-weight: 500; }
.hintrow { display: flex; gap: 6px; flex-wrap: wrap; }
.hbtn { border: 1px dashed var(--line-d); background: #fff; color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.hbtn:hover:not(:disabled) { border-color: var(--gold); background: var(--gold-soft); }
.hbtn:disabled { opacity: .45; cursor: not-allowed; }
.hbtn.open { border-style: solid; border-color: #EBD5A6; background: var(--gold-soft); opacity: 1; cursor: default; }
.hintlist { display: grid; gap: 6px; }
.hintlist p { background: var(--gold-soft); border-left: 3px solid var(--gold); border-radius: 4px 8px 8px 4px; padding: 8px 12px; font-size: 15px; }
.hintlist p b { font-weight: 800; margin-right: 8px; color: #9A6A12; }
.task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: grid; gap: 10px; }
.task h3 { font-size: 17px; display: flex; gap: 10px; align-items: center; }
.task .sn { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
.task.done .sn { background: var(--teal); }
.rootchips { display: flex; flex-wrap: wrap; gap: 8px; }
.rchip { border: 1.5px solid var(--line-d); background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 16px; font-size: 15.5px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: background .12s, border-color .12s; }
.rchip:hover { border-color: var(--c); }
.rchip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.rchip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.rchip[aria-pressed="true"] i { background: #fff; }
.rchip.ok { background: var(--ok-soft); border-color: #BFE0D0; color: var(--ok); }
.rchip.bad { background: var(--bad-soft); border-color: #F0C5BC; color: var(--bad); text-decoration: line-through; }
.rchip.miss { border-style: dashed; color: var(--muted); }
span.rchip { cursor: default; }

.clear-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px 20px; display: grid; gap: 12px; text-align: center; justify-items: center; }
.clear-title { font-size: 13px; font-weight: 800; letter-spacing: .2em; color: var(--accent); }
.stars { display: flex; gap: 4px; }
.stars svg { width: 38px; height: 38px; }
@media (prefers-reduced-motion: no-preference) { .stars svg.on { animation: starpop .5s cubic-bezier(.2, 1.6, .4, 1) backwards; } .stars svg.on:nth-child(2) { animation-delay: .15s; } .stars svg.on:nth-child(3) { animation-delay: .3s; } @keyframes starpop { from { transform: scale(0) rotate(-40deg); } } }
.answer-name { font-size: 28px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.15; }
.answer-name small { display: block; font-size: 14.5px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-top: 4px; }
.pts-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; }

  function guideHTML() {

      '<tr><td>1</td><td>출제 준비</td><td>모둠이 좋아하는 분야(음악·스포츠·음식·춤 등) 정하고 섞인 문화 사례 찾기 시작</td><td>12분</td></tr>' +

      '<tr><td>2</td><td>정리</td><td>‘반 전체 지도’에서 문화가 건너온 길의 패턴 찾기 → 인구 구성과 문화 혼종성 연결해 정리</td><td>10분</td></tr></tbody></table></div>' +
      '<h3>점수 모으기</h3><p>‘⓪ 연결 설정’에서 구글 시트를 한 번 연결하면, 학생 점수와 문제가 자동으로 모여요. 학생에게는 연결 설정에서 만든 <b>학생용 링크</b>를 나눠 주세요. 연결하지 않으면 점수 코드·문제 코드를 붙여 넣는 방식으로도 쓸 수 있어요.</p><h3>섞인 문화를 고르는 기준</h3><ul><li><b>근거 1 (단서 글):</b> 누가 무엇을 가져왔는지 찾아요. 예) “아프리카에서 끌려온 사람들의 북 장단” → 아프리카계</li><li><b>근거 2 (인구 지도):</b> 그 사람들이 그 지역에 실제로 많이 왔거나 살고 있는지 확인해요.</li><li>그 나라에 사는 집단이라도 이 문화에 섞이지 않았다면 고르지 않아요. 예) 브라질에는 원주민이 0.6% 있지만 삼바에는 섞이지 않았어요.</li><li>반대로 지금 인구가 적어도 역사 속에서 문화를 남겼다면 골라요. 예) 아르헨티나의 아프리카계(지금 1% 미만)와 탱고.</li><li>혼혈은 섞인 결과라서 고르는 답에 넣지 않아요.</li></ul><h3>점수 규칙</h3><ul><li>위치 점수: 실제 장소와의 거리로 계산해요 (0km = 1,000점, 500km ≈ 720점, 1,500km ≈ 370점). 300km 안이면 황금 도장.</li><li>힌트를 열 때마다 위치 점수 ×0.8 → ×0.6 → ×0.4. 힌트 1은 대륙·바다, 2는 나라, 3은 도시를 알려 주고, 지도에 정답이 들어 있는 노란 범위(반지름 2,500 → 1,200 → 500km)가 함께 나와요.</li><li>섞인 문화: 맞히면 하나에 +100, 틀리면 −50 (0점 아래로는 내려가지 않아요).</li><li>스테이지마다 점수에 따라 별 1~3개(500점 이상 2개, 800점 이상 3개). 마지막 보스 스테이지는 점수 ×2, 힌트는 1개만.</li><li>선생님 보너스(점수판에 직접 입력): 예) 가장 잘 짠 문제, 근거가 가장 탄탄한 정답 설명, 반 지도에서 패턴 발견.</li></ul>' +
      '<h3>지도 팁</h3><ul><li>경쟁이 ‘빨리 찍기’로 흐르지 않게, 찍기 전에 모둠이 근거를 한 문장으로 말하게 해 보세요. (“아프리카 리듬이니까 아프리카계가 많은 곳!”)</li><li>출제 때는 정답 설명에 그곳의 인구 구성을 꼭 연결하게 하세요. 데이터 지도에서 확인할 수 있어요.</li><li>정치적 판단(이민 찬반 등)보다 “사람이 이동하면 문화도 함께 이동하고 섞인다”는 사실에 초점을 두세요.</li><li>학생 화면의 기록은 그 기기의 브라우저에만 저장돼요. 결과는 구글 시트(또는 점수 코드·문제 코드)로 모여요.</li></ul>' +
      '<h3>이 자료가 보통 퀴즈 도구와 다른 점</h3><ul><li>정답을 고르는 대신 <b>지도에 위치를 찍고, 실제 거리로 점수</b>를 매겨요.</li><li>실제 <b>인구 지도</b>를 작전 도구로 쓰며 자료를 해석해요.</li><li>학생이 <b>자기 관심 분야를 조사해 지도 문제를 직접 만들고</b>, 서로의 문제로 대결해요.</li><li>반 전체 사례를 <b>한 지도에 모아</b> 공간적 패턴을 찾아요.</li></ul>' +
      '<h3>자료 출처</h3><ul><li>인구 자료: 각 나라 인구조사 (미국 2020, 멕시코 2020, 과테말라 2018, 쿠바 2012, 도미니카공화국 2006 가구 조사, 콜롬비아 2018, 베네수엘라 2011, 에콰도르 2022, 페루 2017, 볼리비아 2012, 트리니다드토바고 2011, 가이아나 2012, 브라질 2022, 파라과이 2022, 칠레 2017, 아르헨티나 2022, 우루과이 2011). 위키백과 ‘Ethnic groups in Latin America’ 정리표 참고. 나라마다 묻는 방식이 달라 직접 비교할 때 주의해요.</li><li>추정값(지도에 ‘추정’으로 표시): 인구 조사에서 묻지 않은 항목은 CIA World Factbook의 민족 구성 추정치를 썼어요 (멕시코 메스티소 62%·유럽계 10%, 볼리비아 유럽계 5%·아프리카계 1%, 아르헨티나 유럽계·메스티소 97%).</li><li>지도: Natural Earth (world-atlas)</li><li>제작: 생성형 AI(Claude)를 활용한 바이브 코딩. 파일 하나(<code>index.html</code>)로 GitHub Pages에 올려 써요.</li></ul>' +
      '<h3>문제를 바꾸고 싶다면</h3><p><code>index.html</code>을 열어 위쪽 <code>DEFAULT_SET</code>을 고치거나, 출제실에서 만든 문제 코드를 ‘반 문제집 만들기’에 붙여 넣으면 돼요.</p></div>';
